name: Testes

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring, openssl, gd, zip, fileinfo, intl, bcmath
          coverage: none

      - name: Cache das dependências do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      # O pacote precisa instalar no PHP mais antigo que suportamos (8.2).
      - name: Conferir composer.json e composer.lock
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs

      - name: Verificar formatação
        run: ./vendor/bin/pint --test

      # O teste de isolamento multi-tenant é obrigatório em CI (Seção 13).
      - name: Teste de isolamento multi-tenant
        run: php artisan test --filter=TenantIsolationTest

      - name: Suíte completa
        run: php artisan test
