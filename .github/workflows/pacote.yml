name: Pacote de instalação

# Monta o .zip pronto para enviar por FTP/Gerenciador de Arquivos e o publica
# como release, para que exista sempre um link de download estável.
#
# IMPORTANTE: o botão "Code › Download ZIP" do GitHub NÃO serve para publicar.
# Ele entrega o código-fonte sem as bibliotecas (vendor/), e o sistema não roda
# assim. O que vai para a hospedagem é o .zip gerado aqui.

on:
  # Todo push já deixa um pacote pronto — sem precisar de Composer nem de Node
  # na máquina de quem vai publicar.
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacote:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, openssl, gd, zip, fileinfo, intl
          coverage: none

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Montar o pacote
        run: bash deploy/build.sh

      - name: Publicar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: recjota-instalacao
          path: dist/*.zip
          retention-days: 30

      # Link estável, sem precisar navegar pela aba Actions nem estar logado.
      - name: Publicar release "pacote-atual"
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NOTAS=$(cat <<'TXT'
          Pacote pronto para enviar à hospedagem compartilhada, montado
          automaticamente a partir do commit mais recente.

          **Baixe um dos `.zip` abaixo, em Assets.** Não use o botão
          "Code › Download ZIP" da página do repositório: ele entrega o
          código-fonte sem as bibliotecas, e o sistema não roda assim.

          **`...-pasta-unica.zip`** — o mais simples, e o indicado para a
          primeira instalação. Extraia TODO o conteúdo dentro da pasta que o seu
          domínio publica (na Hostinger, normalmente `public_html`). O
          `.htaccess` que acompanha bloqueia o acesso pela web ao `.env`, ao
          `vendor` e ao `storage`.

          **`...-duas-pastas.zip`** — o mais seguro, e o recomendado a médio
          prazo. Tem duas pastas que vão para lugares diferentes:

          - `app/` → **ao lado** da pasta publicada, nunca dentro
          - o **conteúdo** de `document-root/` → **dentro** dela

          O nome da pasta publicada não importa: o sistema não depende dele.

          O passo a passo está em `LEIA-ME-PRIMEIRO.md`, dentro do pacote.
          TXT
          )

          gh release delete pacote-atual --yes --cleanup-tag 2>/dev/null || true

          gh release create pacote-atual dist/*.zip \
            --title "Pacote de instalação (mais recente)" \
            --notes "$NOTAS" \
            --latest
